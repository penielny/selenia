<!doctype html>
<html>
<head><meta charset="utf-8"><title>Test shop</title></head>
<body>
  <form aria-label="Sign in">
    <label for="user">Username</label>
    <input id="user" name="username">
    <input type="password" placeholder="Password">
    <button type="submit">Log in</button>
  </form>

  <button style="display:none">Hidden button</button>
  <button style="visibility:hidden">Invisible button</button>

  <table>
    <tr><td>Mic stand</td><td><button>Remove</button></td></tr>
    <tr><td>Guitar</td><td><button>Remove</button></td></tr>
  </table>

  <a href="/help">Help centre</a>
  <span>$29.99</span>

  <div id="host"></div>
  <script>
    document.getElementById('host').attachShadow({mode: 'open'}).innerHTML = '<button>Shadow button</button>';
  </script>
</body>
</html>
